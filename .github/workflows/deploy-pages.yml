name: Deploy Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: './go/go.mod'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Generate ANTLR Parser
        run: java -jar scripts/antlr.jar -Dlanguage=Go -visitor -package parser -o go/parser Requirements.g4

      - name: Compile Go to TypeScript
        run: |
          go install github.com/s4wave/goscript/cmd/goscript@latest
          mkdir -p out/ts
          goscript compile --dir go --package parser/objects/... --output out/ts --all-dependencies
          echo '{ "compilerOptions": { "target": "es2024", "lib": ["es2024", "dom"], "moduleResolution": "bundler", "allowImportingTsExtensions": true, "noEmit": true, "strict": true, "baseUrl": ".", "paths": { "@goscript/*": ["./@goscript/*"] } } }' > out/ts/tsconfig.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './site/package-lock.json'
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Install dependencies
        working-directory: ./site
        run: npm ci
        
      - name: Build Site
        working-directory: ./site
        run: npm run build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
